name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node session.test.cjs
          node quiz-feedback.test.cjs
          node import.test.cjs
          node together.test.cjs
          node shared-mode.test.cjs
      - name: Prepare site
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          TOGETHER_URL: ${{ vars.TOGETHER_URL || 'https://script.google.com/macros/s/AKfycbzYmYBe1meldQsVQExF0BB6El5Mkje1Ubs5RRUFWAs9ATs5_-rJR47iaxxKIYY99OWqNw/exec' }}
        run: |
          mkdir public
          cp index.html privacy.html terms.html app.js style.css public/
          node -e "require('fs').writeFileSync('public/config.js', 'export const CLIENT_ID = ' + JSON.stringify(process.env.GOOGLE_CLIENT_ID || '') + ';\nexport const TOGETHER_URL = ' + JSON.stringify(process.env.TOGETHER_URL || '') + ';\n')"
          if [ -z "$GOOGLE_CLIENT_ID" ]; then echo "::warning::Set the GOOGLE_CLIENT_ID repository variable to enable Google login."; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

